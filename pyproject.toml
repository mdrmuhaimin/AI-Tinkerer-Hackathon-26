[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-conference-crm"
version = "0.1.0"
description = "AI Conference CRM — deterministic capture graph"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "pydantic",
    "groq",
    "python-dotenv",
    "python-telegram-bot>=22.8,<23",
    "sqlite-vec",
    "apsw",
    "langsmith",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
crm = "crm.cli:main"

[tool.setuptools.packages.find]
include = ["crm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a live AI provider (deselect with -m 'not live')",
]
addopts = ["-m", "not live"]
